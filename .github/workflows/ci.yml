name: CI

on:
  pull_request:
    branches: ['develop/**', 'release/**']
  push:
    branches: ['develop/**', 'release/**']
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, format, types, tests and build
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  version:
    name: Version matches the branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm run check:version

  smoke:
    name: Desktop smoke test
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run smoke -- quick
      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke
          path: .smoke/
          include-hidden-files: true
          if-no-files-found: ignore
