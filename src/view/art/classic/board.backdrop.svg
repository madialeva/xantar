<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle class="f-backdropAccent" cx="0" cy="0" r="1.5"/>
      <circle class="f-backdropAccent" cx="16" cy="16" r="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  <rect class="f-backdrop" x="0" y="0" width="640" height="480" rx="10"/>
  <rect x="0" y="0" width="640" height="480" rx="10" fill="url(#dots)"/>
  <rect class="f-highlight" x="0" y="0" width="640" height="480" rx="10" opacity="0.02"/>
</svg>
